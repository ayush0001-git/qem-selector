[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qemsel"
version = "0.1.0"
description = "Benchmark quantum error mitigation (QEM) techniques and train an ML model to recommend the best technique per circuit."
requires-python = ">=3.12"
# NOTE: runtime dependencies are intentionally NOT listed here.
# The environment is pinned by requirements.txt (see docs/internal/PROJECT_STATE.md);
# listing deps here would make `pip install -e .` re-resolve and risk breaking pins.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavy multi-backend noise-model regression tests (deselect with -m 'not slow')",
]
