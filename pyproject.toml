[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qemsel"
version = "0.1.0"
description = "Benchmark quantum error mitigation (QEM) techniques and train an ML model to recommend the best technique per circuit."
requires-python = ">=3.12"
dependencies = [
    "mitiq>=1.0.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavy multi-backend noise-model regression tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
